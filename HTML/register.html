<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- <link rel="stylesheet" href="css/bootstrap.css" /> -->
    <title>Queue Care</title>

        <link rel="stylesheet" href="../CSS/register.css">
    
  </head>

  <body>
    <nav class="main-navbar">
      <div class="logo">Queue Care</div>
      <div class="back-home">
        <a href="first-page.html">
          <i class="fa-solid fa-arrow-left"></i>

          الصفحه الرئيسية
        </a>
      </div>
    </nav>

    <section class="register-section">
      <div class="register-container">
        <div class="register-header">
          <div class="register-icon">
            <i class="fa-solid fa-user-plus"></i>
          </div>

          <h2>إنشاء حساب</h2>

          <p>أنشئ حسابك وابدأ في حجز مواعيدك بسهولة.</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label>الاسم بالكامل</label>

            <div class="input-box">
              <i class="fa-solid fa-user"></i>

              <input
                type="text"
                id="name"
                placeholder="أدخل اسمك بالكامل"
                required
              />
            </div>
            <p id="errorname"></p>
          </div>
           

          <div class="form-group">
            <label>البريد الالكتروني</label>

            <div class="input-box">
              <i class="fa-solid fa-at"></i>

              <input
                type="email"
                id="email"
                placeholder="ادخل بريدك الاكتروني"
                required
              />
            </div>
            <p id="erroremail"></p>
          </div>
           

          <div class="form-group">
            <label>رقم الهاتف</label>

            <div class="input-box">
              <i class="fa-solid fa-phone"></i>

              <input type="tel" id="phone" placeholder="01xxxxxxxxx" required />
            </div>
            <p id="errorphone"></p>
          </div>
           

          <div class="form-group">
            <label>تاريخ الميلاد</label>

            <div class="input-box">
              <i class="fa-solid fa-calendar"></i>

              <input type="date" id="birthDate" required />
            </div>
          </div>

          <div class="form-group">
            <label>كلمة المرور</label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="password"
                placeholder="********"
                required
              />

              <button type="button" class="show-password" onclick="showPass()">
                <i class="fa-solid fa-eye" id="iconeye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>تأكيد كلمة المرور</label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="confirmPassword"
                placeholder="********"
                required
              />

              <button type="button" class="show-password" onclick="showPassrepete()">
                <i class="fa-solid fa-eye" id="iconeye2"></i>
              </button>
            </div>
            <p id="errorpass"></p>
          </div>
           

          <div class="agree">
            <input type="checkbox" id="agree" required />

            <label for="agree"> أوافق على الشروط والأحكام </label>
          </div>

          <button type="submit" class="register-btn" onclick="check()">
            إنشاء حساب
          </button>

          <p class="login-link">
            لديك حساب بالفعل؟

            <a href="login.html"> تسجيل الدخول </a>
          </p>
        </form>
      </div>
    </section>
    <script src="register.js"></script>
  </body>
</html>
