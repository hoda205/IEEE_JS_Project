<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحجز</title>
    <link rel="stylesheet" href="../CSS/home.css">
</head>
<body>

    <div class="card">
        
        <div class="doctor-info">
            <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=100&h=100&fit=crop" alt="د. أحمد محمد" class="doctor-img">
            <div class="doctor-details">
                <h2>د. أحمد محمد</h2>
                <p class="specialty">استشاري أمراض الباطنة</p>
                <p class="rating">⭐ 4.9 (100 مستخدم)</p>
            </div>
        </div>

        <div class="clinic-info">
            <div class="clinic-loc">
                <span class="loc-icon">📍</span>
                <div>
                    <h3>عيادة النخيل</h3>
                    <p>المهندسين - شارع جامعة الدول</p>
                    <a href="#" class="map-link">عرض على الخريطة</a>
                </div>
            </div>
            <div class="status">
                <span>حالة الحجز</span>
                <strong class="confirmed">مؤكد</strong>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span>سعر الكشف</span>
                <strong>300</strong>
            </div>
            <div class="stat-box">
                <span>عدد المستفيدين</span>
                <strong>12</strong>
            </div>
            <div class="stat-box">
                <span>الموعد</span>
                <p>الثلاثاء، 14 مايو 2026</p>
                <strong>09:30 AM</strong>
            </div>
        </div>

        <button id="bookBtn" class="book-btn">إحجز الآن</button>

    </div>

    <script src="../JS/home.js"></script>
</body>
</html>
