<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحجز</title>
    <link rel="stylesheet" href="../CSS/home.css">
</head>
<body>

    <div class="card">
        
        <div class="doctor-info">
            <img id="doctorImg" src="../assets//users/" alt="صورة الدكتور" class="doctor-img">
            <div class="doctor-details">
                <h2 id="doctorName">---</h2>
                <p id="doctorSpecialty" class="specialty">---</p>
                <p class="rating"><i class="fa-solid fa-star"></i> 4.9 (100 مستخدم)</p>
            </div>
        </div>

        <div class="clinic-info">
            <div class="clinic-loc">
                <span class="loc-icon"><i class="fa-solid fa-location-dot"></i></span>
                <div>
                    <h3 id="clinicLocation">جاري التحميل...</h3>
                    <p id="clinicAddress">المهندسين - شارع جامعة الدول</p>
                    <!-- <a href="#" class="map-link">عرض على الخريطة</a> -->
                </div>
            </div>
            <div class="status">
                <span>حالة الحجز</span>
                <strong id="bookingStatus" class="confirmed">مؤكد</strong>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span>سعر الكشف</span>
                <strong id="consultationFee">---</strong>
            </div>
            <div class="stat-box">
                <span>عدد المنتظرين</span>
                <strong id="waitingCount">0</strong>
            </div>
            <div class="stat-box">
                <span>الموعد</span>
                <!-- <p id="appointmentDate">---</p> -->
                <strong id="appointmentTime">---</strong>
            </div>
        </div>

        <button  id="bookBtn" class="book-btn">إحجز الآن</button>

    </div>

    <script type="module" src="../JS/Pages/home.js"></script>
    <script src="../JS/initialSetup.js"></script>
</body>
</html>
