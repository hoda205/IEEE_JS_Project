<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue Care | تسجيل الدخول</title>

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/login.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="main-navbar">
      <div class="back-home">
        <a href="index.html">
          <i class="fa-solid fa-arrow-right"></i>
          <span>الصفحة الرئيسية</span>
        </a>
      </div>
      <div class="logo">Queue Care</div>
    </nav>

    <!-- Login Section -->
    <main class="login-section">
      <div class="login-container">
        <div class="login-form-container">
          <header class="login-header">
            <div class="login-icon">
              <i class="fa-solid fa-user"></i>
            </div>
            <h2>تسجيل الدخول</h2>
            <p>اختر نوع الحساب لتسجيل الدخول</p>
          </header>

          <!-- Account Type Selector
          <div class="user-types" role="tablist" aria-label="نوع الحساب">
            <button type="button" class="user-type active" role="tab" aria-selected="true">
              <i class="fa-solid fa-user"></i>
              <span>مريض</span>
            </button>

            <button type="button" class="user-type" role="tab" aria-selected="false">
              <i class="fa-solid fa-user-doctor"></i>
              <span>دكتور</span>
            </button>
          </div> -->

          <!-- Login Form -->
          <form id="loginForm">
            <!-- Phone Number Field -->
            <div class="form-group">
              <label for="phone">رقم الهاتف</label>
              <div class="input-box">
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="أدخل رقم الهاتف"
                  required
                />
                <i class="fa-solid fa-phone"></i>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="password">كلمة المرور</label>
              <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="أدخل كلمة المرور"
                  required
                />
                <button
                  type="button"
                  class="show-password"
                  id="showPassword"
                  aria-label="عرض كلمة المرور"
                >
                  <i class="fa-solid fa-eye" id="iconeye"></i>
                </button>
              </div>
              <p id="errorMsg"></p>
            </div>
            <!-- Options -->
            <div class="login-options">
              <label class="remember">
                <input type="checkbox" id="rememberMe" name="remember" />
                <span>تذكرني</span>
              </label>

              <a href="#">نسيت كلمة المرور؟</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="login-submit">تسجيل الدخول</button>

            <!-- Register Link -->
            <p class="register-text">
              ليس لديك حساب؟
              <a href="register.html">إنشاء حساب جديد</a>
            </p>
          </form>
        </div>
      </div>
    </main>

    <script type="module" src="../JS/Pages/login.js"></script>
  </body>
</html>
